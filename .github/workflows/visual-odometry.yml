name: Validated visual odometry
on:
  push:
    paths: ['Project/vision_odometry/**', '.github/workflows/visual-odometry.yml']
  pull_request:
    paths: ['Project/vision_odometry/**', '.github/workflows/visual-odometry.yml']
jobs:
  geometry-and-inputs:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Project/vision_odometry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update -qq && sudo apt-get install -y libopencv-dev cmake g++ pkg-config
      - run: python -m pip install -r requirements.txt
      - run: make && ctest --test-dir build --output-on-failure
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests -q
      - run: make clean && test ! -d build
